<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LedgerMan — Communications Dashboard</title>
<style>
  :root {
    --bg: #0e0e1a;
    --surface: #16162a;
    --border: #2a2a40;
    --accent: #c9a84c;
    --accent-dim: rgba(201,168,76,.15);
    --text: #e8e8f0;
    --text-dim: #8888a8;
    --green: #2ecc71;
    --red: #e74c3c;
    --orange: #e67e22;
    --blue: #3498db;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; font-size: 14px; }

  /* Layout */
  .layout { display: flex; min-height: 100vh; }
  .sidebar {
    width: 220px; background: var(--surface); border-right: 1px solid var(--border);
    padding: 24px 0; flex-shrink: 0;
  }
  .sidebar .logo { padding: 0 20px 24px; border-bottom: 1px solid var(--border); }
  .sidebar .logo h1 { color: var(--accent); font-size: 18px; font-weight: 700; }
  .sidebar .logo p { color: var(--text-dim); font-size: 11px; margin-top: 2px; }
  .nav-item {
    padding: 10px 20px; cursor: pointer; color: var(--text-dim);
    border-left: 3px solid transparent; transition: all .15s;
  }
  .nav-item:hover, .nav-item.active { color: var(--text); border-left-color: var(--accent); background: var(--accent-dim); }
  .main { flex: 1; padding: 28px 32px; overflow-x: auto; }

  /* Auth gate */
  #auth-gate {
    position: fixed; inset: 0; background: rgba(0,0,0,.85);
    display: flex; align-items: center; justify-content: center; z-index: 100;
  }
  .auth-box {
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    padding: 32px 36px; width: 340px;
  }
  .auth-box h2 { color: var(--accent); margin-bottom: 20px; font-size: 18px; }
  .auth-box input {
    width: 100%; background: var(--bg); border: 1px solid var(--border);
    color: var(--text); padding: 10px 12px; border-radius: 6px; font-size: 14px;
    margin-bottom: 14px;
  }
  .auth-box .btn { width: 100%; }
  .auth-error { color: var(--red); font-size: 12px; margin-top: 8px; }

  /* Buttons */
  .btn {
    background: var(--accent); color: #111; border: none; padding: 8px 18px;
    border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 13px;
    transition: opacity .15s;
  }
  .btn:hover { opacity: .85; }
  .btn.secondary { background: transparent; color: var(--text-dim); border: 1px solid var(--border); }
  .btn.danger    { background: var(--red); color: #fff; }
  .btn.success   { background: var(--green); color: #fff; }
  .btn.sm { padding: 5px 12px; font-size: 12px; }

  /* Stats row */
  .stats { display: flex; gap: 16px; margin-bottom: 28px; flex-wrap: wrap; }
  .stat-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
    padding: 16px 20px; flex: 1; min-width: 120px;
  }
  .stat-card .val { font-size: 26px; font-weight: 700; color: var(--accent); }
  .stat-card .lbl { font-size: 11px; color: var(--text-dim); text-transform: uppercase; letter-spacing: .5px; margin-top: 4px; }

  /* Table */
  .section-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 16px;
  }
  .section-header h2 { font-size: 16px; font-weight: 600; }
  .filter-row { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }
  .filter-row select, .filter-row input {
    background: var(--surface); border: 1px solid var(--border); color: var(--text);
    padding: 7px 12px; border-radius: 6px; font-size: 13px;
  }
  table { width: 100%; border-collapse: collapse; }
  th {
    text-align: left; padding: 10px 12px; font-size: 11px; color: var(--text-dim);
    text-transform: uppercase; letter-spacing: .5px; border-bottom: 1px solid var(--border);
  }
  td { padding: 11px 12px; border-bottom: 1px solid var(--border); vertical-align: top; }
  tr:hover td { background: rgba(255,255,255,.025); }

  /* Status badges */
  .badge {
    display: inline-block; padding: 2px 9px; border-radius: 12px;
    font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .3px;
  }
  .badge.pending           { background: rgba(52,152,219,.2); color: var(--blue); }
  .badge.awaiting_approval { background: rgba(230,126,34,.2); color: var(--orange); }
  .badge.approved          { background: rgba(46,204,113,.15); color: #4ade80; }
  .badge.sending           { background: rgba(201,168,76,.2); color: var(--accent); }
  .badge.sent              { background: rgba(46,204,113,.2); color: var(--green); }
  .badge.failed            { background: rgba(231,76,60,.2); color: var(--red); }
  .badge.cancelled         { background: rgba(100,100,120,.2); color: var(--text-dim); }

  /* Risk badges */
  .risk-low      { color: var(--green); font-size: 11px; }
  .risk-medium   { color: var(--accent); font-size: 11px; }
  .risk-high     { color: var(--orange); font-size: 11px; }
  .risk-critical { color: var(--red); font-size: 11px; font-weight: 700; }

  /* Action buttons column */
  .actions { display: flex; gap: 6px; flex-wrap: wrap; }

  /* Toast */
  #toast {
    position: fixed; bottom: 24px; right: 24px; background: var(--surface);
    border: 1px solid var(--border); border-radius: 8px; padding: 12px 20px;
    font-size: 13px; opacity: 0; transition: opacity .2s; z-index: 200;
    max-width: 320px;
  }
  #toast.show { opacity: 1; }
  #toast.ok   { border-color: var(--green); color: var(--green); }
  #toast.err  { border-color: var(--red);   color: var(--red);   }

  /* Detail panel */
  #detail-panel {
    position: fixed; right: 0; top: 0; bottom: 0; width: 480px;
    background: var(--surface); border-left: 1px solid var(--border);
    padding: 24px; overflow-y: auto; z-index: 50;
    transform: translateX(100%); transition: transform .2s;
  }
  #detail-panel.open { transform: translateX(0); }
  #detail-panel h3 { color: var(--accent); margin-bottom: 20px; }
  .detail-row { margin-bottom: 14px; }
  .detail-row .lbl { font-size: 11px; color: var(--text-dim); text-transform: uppercase; letter-spacing: .4px; margin-bottom: 4px; }
  .detail-row .val { font-size: 13px; word-break: break-word; }
  .detail-row .body-preview {
    background: var(--bg); border: 1px solid var(--border); border-radius: 6px;
    padding: 12px; max-height: 200px; overflow-y: auto; font-size: 12px; line-height: 1.5;
    white-space: pre-wrap;
  }

  .empty-state {
    text-align: center; padding: 48px 0; color: var(--text-dim);
  }
  .empty-state p { font-size: 15px; margin-top: 8px; }

  /* Tabs */
  .tabs { display: flex; gap: 4px; margin-bottom: 20px; border-bottom: 1px solid var(--border); }
  .tab {
    padding: 9px 18px; cursor: pointer; color: var(--text-dim); border-bottom: 2px solid transparent;
    font-size: 13px; transition: all .15s; margin-bottom: -1px;
  }
  .tab:hover { color: var(--text); }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); }
</style>
</head>
<body>

<!-- Auth gate -->
<div id="auth-gate">
  <div class="auth-box">
    <h2>🔐 LedgerMan Superadmin</h2>
    <input type="password" id="key-input" placeholder="Super-admin key" />
    <button class="btn" onclick="doAuth()">Authenticate</button>
    <div class="auth-error" id="auth-err"></div>
  </div>
</div>

<div class="layout">
  <!-- Sidebar -->
  <div class="sidebar">
    <div class="logo">
      <h1>LedgerMan</h1>
      <p>Communications</p>
    </div>
    <div class="nav-item active" onclick="showTab('queue')">📬 Queue</div>
    <div class="nav-item" onclick="showTab('approval')">⏳ Awaiting Approval</div>
    <div class="nav-item" onclick="showTab('history')">📋 History</div>
    <div class="nav-item" onclick="showTab('stats')">📊 Stats</div>
    <div class="nav-item" style="margin-top:auto" onclick="refreshAll()">↻ Refresh</div>
  </div>

  <!-- Main -->
  <div class="main" id="main-content">
    <!-- Stats -->
    <div id="view-stats" style="display:none">
      <div class="section-header"><h2>Queue Health</h2><button class="btn sm secondary" onclick="loadStats()">↻ Refresh</button></div>
      <div class="stats" id="stats-cards"></div>
    </div>

    <!-- Queue -->
    <div id="view-queue">
      <div class="section-header">
        <h2>Communications Queue</h2>
        <button class="btn sm secondary" onclick="loadQueue()">↻ Refresh</button>
      </div>
      <div class="filter-row">
        <select id="status-filter" onchange="loadQueue()">
          <option value="all">All Statuses</option>
          <option value="pending">Pending</option>
          <option value="awaiting_approval">Awaiting Approval</option>
          <option value="sending">Sending</option>
          <option value="failed">Failed</option>
          <option value="cancelled">Cancelled</option>
        </select>
      </div>
      <div id="queue-table-wrap"></div>
    </div>

    <!-- Approval -->
    <div id="view-approval" style="display:none">
      <div class="section-header">
        <h2>Awaiting Approval</h2>
        <button class="btn sm secondary" onclick="loadApproval()">↻ Refresh</button>
      </div>
      <div id="approval-table-wrap"></div>
    </div>

    <!-- History -->
    <div id="view-history" style="display:none">
      <div class="section-header">
        <h2>Communication History</h2>
        <button class="btn sm secondary" onclick="loadHistory()">↻ Refresh</button>
      </div>
      <div class="tabs">
        <div class="tab active" onclick="historyTab('sent', this)">Sent</div>
        <div class="tab" onclick="historyTab('failed', this)">Failed</div>
      </div>
      <div id="history-table-wrap"></div>
    </div>
  </div>
</div>

<!-- Detail panel -->
<div id="detail-panel">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px">
    <h3>Communication Detail</h3>
    <button class="btn sm secondary" onclick="closeDetail()">✕ Close</button>
  </div>
  <div id="detail-content"></div>
</div>

<div id="toast"></div>

<script>
const API = 'https://ledgerman-backend.onrender.com';
let SUPERADMIN_KEY = '';
let _historyData = { sent: [], failed: [] };
let _currentHistoryTab = 'sent';

// ── Auth ─────────────────────────────────────────────────────────────────────

async function doAuth() {
  const key = document.getElementById('key-input').value.trim();
  if (!key) return;
  try {
    const r = await fetch(`${API}/api/superadmin/comms/stats`, {
      headers: { 'X-Superadmin-Key': key }
    });
    if (r.status === 403) {
      document.getElementById('auth-err').textContent = 'Invalid key';
      return;
    }
    SUPERADMIN_KEY = key;
    document.getElementById('auth-gate').style.display = 'none';
    refreshAll();
  } catch (e) {
    document.getElementById('auth-err').textContent = 'Connection failed: ' + e.message;
  }
}

document.getElementById('key-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') doAuth();
});

// ── Fetch helpers ─────────────────────────────────────────────────────────────

async function api(path, method = 'GET', body = null) {
  const opts = {
    method,
    headers: { 'X-Superadmin-Key': SUPERADMIN_KEY, 'Content-Type': 'application/json' }
  };
  if (body) opts.body = JSON.stringify(body);
  const r = await fetch(API + path, opts);
  return r.json();
}

function toast(msg, type = 'ok') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'show ' + type;
  setTimeout(() => el.className = '', 3000);
}

// ── Navigation ────────────────────────────────────────────────────────────────

function showTab(tab) {
  document.querySelectorAll('#main-content > div').forEach(d => d.style.display = 'none');
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  document.getElementById('view-' + tab).style.display = '';
  event.currentTarget.classList.add('active');
  if (tab === 'queue')    loadQueue();
  if (tab === 'approval') loadApproval();
  if (tab === 'history')  loadHistory();
  if (tab === 'stats')    loadStats();
}

function refreshAll() {
  loadQueue();
  loadStats();
}

// ── Stats ─────────────────────────────────────────────────────────────────────

async function loadStats() {
  const data = await api('/api/superadmin/comms/stats');
  const labels = {
    pending: 'Pending', awaiting_approval: 'Awaiting Approval',
    sending: 'Sending', sent: 'Sent', failed: 'Failed',
    cancelled: 'Cancelled', total: 'Total'
  };
  const colors = {
    pending: '#3498db', awaiting_approval: '#e67e22', sending: '#c9a84c',
    sent: '#2ecc71', failed: '#e74c3c', cancelled: '#666', total: '#c9a84c'
  };
  const order = ['total', 'pending', 'awaiting_approval', 'sending', 'sent', 'failed', 'cancelled'];
  document.getElementById('stats-cards').innerHTML = order.map(k => {
    if (data[k] === undefined) return '';
    return `<div class="stat-card">
      <div class="val" style="color:${colors[k]||'#c9a84c'}">${data[k]}</div>
      <div class="lbl">${labels[k] || k}</div>
    </div>`;
  }).join('');
}

// ── Queue table ───────────────────────────────────────────────────────────────

async function loadQueue() {
  const status = document.getElementById('status-filter').value;
  const data = await api(`/api/superadmin/comms?status=${status}&limit=200`);
  document.getElementById('queue-table-wrap').innerHTML = renderTable(data.items || [], ['queue','approval']);
}

async function loadApproval() {
  const data = await api('/api/superadmin/comms?status=awaiting_approval&limit=200');
  document.getElementById('approval-table-wrap').innerHTML = renderTable(data.items || [], ['approve']);
}

async function loadHistory() {
  const data = await api('/api/superadmin/comms/history?limit=400');
  _historyData = { sent: data.sent || [], failed: data.failed || [] };
  renderHistory();
}

function historyTab(tab, el) {
  _currentHistoryTab = tab;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  renderHistory();
}

function renderHistory() {
  document.getElementById('history-table-wrap').innerHTML =
    renderTable(_historyData[_currentHistoryTab] || [], []);
}

// ── Table renderer ────────────────────────────────────────────────────────────

function renderTable(items, actions) {
  if (!items.length) return `<div class="empty-state"><p>No communications found.</p></div>`;

  const rows = items.map(item => {
    const risk = `<span class="risk-${item.risk_level}">${item.risk_level}</span>`;
    const status = `<span class="badge ${item.status}">${item.status.replace('_', ' ')}</span>`;
    const ts = item.created_at ? item.created_at.slice(0,16).replace('T',' ') : '';
    const sent = item.sent_at ? item.sent_at.slice(0,16).replace('T','') : '-';

    let btns = `<button class="btn sm secondary" onclick='showDetail(${JSON.stringify(item)})'>View</button>`;
    if (actions.includes('approve') && item.status === 'awaiting_approval')
      btns += ` <button class="btn sm success" onclick="approveItem('${item.id}')">Approve</button>`;
    if (actions.includes('queue') && ['pending','awaiting_approval','failed','cancelled'].includes(item.status))
      btns += ` <button class="btn sm danger" onclick="cancelItem('${item.id}')">Cancel</button>`;
    if (item.status === 'failed')
      btns += ` <button class="btn sm secondary" onclick="retryItem('${item.id}')">Retry</button>`;

    return `<tr>
      <td style="font-size:11px;color:var(--text-dim)">${ts}</td>
      <td><code style="font-size:11px">${item.event_type}</code></td>
      <td style="max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${item.recipient}</td>
      <td style="max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px">${item.subject}</td>
      <td>${status}</td>
      <td>${risk}</td>
      <td style="font-size:11px">${item.retry_count}/${item.max_retries}</td>
      <td style="font-size:11px;color:var(--text-dim)">${sent}</td>
      <td><div class="actions">${btns}</div></td>
    </tr>`;
  }).join('');

  return `<table>
    <thead><tr>
      <th>Created</th><th>Event</th><th>Recipient</th><th>Subject</th>
      <th>Status</th><th>Risk</th><th>Retries</th><th>Sent</th><th>Actions</th>
    </tr></thead>
    <tbody>${rows}</tbody>
  </table>`;
}

// ── Actions ───────────────────────────────────────────────────────────────────

async function approveItem(id) {
  try {
    const r = await api(`/api/superadmin/comms/${id}/approve`, 'POST', { approvedBy: 'superadmin' });
    if (r.approved) { toast('Approved — queued for send'); refreshAll(); loadApproval(); }
    else toast(r.error || 'Approve failed', 'err');
  } catch (e) { toast('Error: ' + e.message, 'err'); }
}

async function cancelItem(id) {
  if (!confirm('Cancel this communication?')) return;
  try {
    const r = await api(`/api/superadmin/comms/${id}/cancel`, 'POST');
    if (r.cancelled) { toast('Cancelled'); loadQueue(); }
    else toast(r.error || 'Cancel failed', 'err');
  } catch (e) { toast('Error: ' + e.message, 'err'); }
}

async function retryItem(id) {
  try {
    const r = await api(`/api/superadmin/comms/${id}/retry`, 'POST');
    if (r.queued) { toast('Queued for retry'); loadQueue(); }
    else toast(r.error || 'Retry failed', 'err');
  } catch (e) { toast('Error: ' + e.message, 'err'); }
}

// ── Detail panel ──────────────────────────────────────────────────────────────

function showDetail(item) {
  let ctx = {};
  try { ctx = JSON.parse(item.context_json || '{}'); } catch(e) {}
  // Redact password fields from display
  if (ctx.password) ctx.password = '••••••••';
  if (ctx.new_password) ctx.new_password = '••••••••';

  document.getElementById('detail-content').innerHTML = `
    <div class="detail-row"><div class="lbl">Queue ID</div><div class="val" style="font-size:11px;font-family:monospace">${item.id}</div></div>
    <div class="detail-row"><div class="lbl">Event Type</div><div class="val">${item.event_type}</div></div>
    <div class="detail-row"><div class="lbl">Recipient</div><div class="val">${item.recipient}</div></div>
    <div class="detail-row"><div class="lbl">Subject</div><div class="val">${item.subject}</div></div>
    <div class="detail-row"><div class="lbl">Status</div><div class="val"><span class="badge ${item.status}">${item.status}</span></div></div>
    <div class="detail-row"><div class="lbl">Risk Level</div><div class="val"><span class="risk-${item.risk_level}">${item.risk_level}</span></div></div>
    <div class="detail-row"><div class="lbl">Draft Source</div><div class="val">${item.draft_source}</div></div>
    <div class="detail-row"><div class="lbl">Company ID</div><div class="val" style="font-size:11px;font-family:monospace">${item.company_id || '—'}</div></div>
    <div class="detail-row"><div class="lbl">Triggered By</div><div class="val">${item.triggered_by}</div></div>
    <div class="detail-row"><div class="lbl">Created</div><div class="val">${item.created_at || '—'}</div></div>
    <div class="detail-row"><div class="lbl">Sent At</div><div class="val">${item.sent_at || '—'}</div></div>
    <div class="detail-row"><div class="lbl">Retries</div><div class="val">${item.retry_count} / ${item.max_retries}</div></div>
    ${item.last_error ? `<div class="detail-row"><div class="lbl">Last Error</div><div class="val" style="color:var(--red)">${item.last_error}</div></div>` : ''}
    ${item.approved_by ? `<div class="detail-row"><div class="lbl">Approved By</div><div class="val">${item.approved_by} at ${item.approved_at}</div></div>` : ''}
    <div class="detail-row"><div class="lbl">Email Body (Plain)</div><div class="body-preview">${(item.body_plain||'').slice(0,600)}</div></div>
    <div class="detail-row"><div class="lbl">Event Context</div><div class="body-preview">${JSON.stringify(ctx, null, 2)}</div></div>
    <div style="display:flex;gap:8px;margin-top:20px;flex-wrap:wrap">
      ${item.status === 'awaiting_approval' ? `<button class="btn success" onclick="approveItem('${item.id}');closeDetail()">Approve & Send</button>` : ''}
      ${['pending','awaiting_approval','failed','cancelled'].includes(item.status) ? `<button class="btn danger" onclick="cancelItem('${item.id}');closeDetail()">Cancel</button>` : ''}
      ${item.status === 'failed' ? `<button class="btn secondary" onclick="retryItem('${item.id}');closeDetail()">Retry</button>` : ''}
    </div>
  `;
  document.getElementById('detail-panel').classList.add('open');
}

function closeDetail() {
  document.getElementById('detail-panel').classList.remove('open');
}

// ── Auto-refresh every 30s ────────────────────────────────────────────────────
setInterval(() => {
  if (SUPERADMIN_KEY) {
    const active = document.querySelector('.nav-item.active');
    if (!active) return;
    const tab = active.getAttribute('onclick').match(/'(\w+)'/)?.[1];
    if (tab === 'queue')    loadQueue();
    if (tab === 'approval') loadApproval();
    if (tab === 'stats')    loadStats();
  }
}, 30000);
</script>
</body>
</html>
