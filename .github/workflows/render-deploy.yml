name: Deploy to Render on push
# Reliable auto-deploy: Render's GitHub App wasn't triggering deploys for this repo
# (nothing deployed 2026-05-24 .. 2026-07-03). This Action triggers a Render deploy on
# every push to main via the Render API, independent of the GitHub App connection.
on:
  push:
    branches: [main]
  workflow_dispatch: {}
jobs:
  trigger-render-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy (ledgerman-admin)
        run: |
          set -e
          curl -fsS -X POST \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            -H "Content-Type: application/json" \
            "https://api.render.com/v1/services/srv-d6uf82h4tr6s73c3rvb0/deploys" \
            -d '{"clearCache":"do_not_clear"}'
          echo "Render deploy triggered for ledgerman-admin (srv-d6uf82h4tr6s73c3rvb0)"
