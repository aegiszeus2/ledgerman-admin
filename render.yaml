services:
  - type: static
    name: ledgerman-admin
    buildCommand: ''
    staticPublishPath: ./
    headers:
      - path: /index.html
        headers:
          - key: Cache-Control
            value: no-cache, no-store, must-revalidate
          - key: Pragma
            value: no-cache
          - key: Expires
            value: "0"
